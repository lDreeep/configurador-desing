name: Validar configurador
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.56.1 @axe-core/playwright@4.10.2
      - run: npx playwright install --with-deps chromium
      - run: node scripts/comprobar-concesionario.mjs
      - run: node scripts/comprobar-simple.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-concesionario
          path: screenshots/concesionario/
