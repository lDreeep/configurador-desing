<title>Molde: ideas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400;500;600;700&family=Archivo:wght@900&family=Fraunces:opsz,wght@9..144,600&family=Unbounded:wght@700&display=swap">
<style>
/* Maqueta 2 de Molde. Concepto: la página arranca en blanco; un botón en el centro explota en
   ideas, y cada idea elegida se queda en la página. El marco (yeso, tinta, silicona) no cambia. */
:root {
  --yeso: #F7F8FA; --superficie: #FFFFFF; --tinta: #1D1730; --tinta-2: #5A5470; --linea: #D5D9E0;
  --silicona: #D81E6A; --sobre-silicona: #FFFFFF; --sombra: rgba(29, 23, 48, .18);
  --f-marca: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif; --f-texto: 'Instrument Sans', system-ui, sans-serif;
  --toque: 140ms; --cambio: 560ms; --curva: cubic-bezier(.2, .8, .2, 1); --rebote: cubic-bezier(.3, 1.45, .45, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --yeso: #15121C; --superficie: #2A2338; --tinta: #F1EEF6; --tinta-2: #B0A9C0; --linea: #443B58;
  --silicona: #FF6BA3; --sobre-silicona: #1D1730; --sombra: rgba(0, 0, 0, .55); color-scheme: dark } }
:root[data-theme="dark"] {
  --yeso: #15121C; --superficie: #2A2338; --tinta: #F1EEF6; --tinta-2: #B0A9C0; --linea: #443B58;
  --silicona: #FF6BA3; --sobre-silicona: #1D1730; --sombra: rgba(0, 0, 0, .55); color-scheme: dark }

* { box-sizing: border-box }
html, body { height: 100%; overflow: hidden }
body { background: var(--yeso); color: var(--tinta); font: 16px/1.45 var(--f-texto) }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none }
:focus-visible { outline: 3px solid var(--silicona); outline-offset: 3px }
/* Lo que tiene `hidden` no se ve nunca, aunque su clase le ponga display (flechas, «Usar», descargas). */
[hidden] { display: none !important }

#app { position: relative; height: 100%; overflow: hidden; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

.barra { position: absolute; inset: 0 0 auto; height: 64px; display: flex; align-items: center; z-index: 8; pointer-events: none;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)) }
.barra > * { pointer-events: auto }
.marca { display: flex; align-items: center; gap: 9px; font: 700 24px/1 var(--f-marca); letter-spacing: -.02em }
.marca i { width: 19px; height: 19px; border: 4px solid var(--silicona); border-radius: 6px }
.barra .hueco { flex: 1 }
.enlace { min-height: 44px; padding: 0 12px; color: var(--tinta-2); font-weight: 500; text-decoration: underline; text-underline-offset: 4px }

/* El lienzo: vacío al principio, después la página que se va armando */
.lienzo { position: absolute; inset: 64px 16px 88px; border-radius: 22px; overflow: hidden; transition: box-shadow var(--cambio) }
.lienzo.hay { box-shadow: 0 0 0 1px var(--linea), 0 30px 60px -30px var(--sombra) }
.capa { position: absolute; inset: 0 }
#base { transition: opacity var(--cambio), filter var(--cambio) }
.eligiendo #base { opacity: .3; filter: saturate(.55) }
#prev { clip-path: circle(0 at 50% 50%); transition: clip-path 220ms ease-in }
#prev.on { clip-path: circle(120% at 50% 50%); transition: clip-path var(--cambio) var(--curva) }
#prev.sin { transition: none }

/* ───── Portada: se baja y se van armando páginas ───── */
.portada { position: absolute; inset: 0; z-index: 5; overflow-y: auto; scrollbar-width: none }
.portada::-webkit-scrollbar { display: none }
.centro { position: absolute; left: 50%; top: calc(50% - 80px); transform: translate(-50%, -50%); z-index: 4; display: grid; justify-items: center; gap: 16px;
  text-align: center; width: min(92%, 620px); pointer-events: none; will-change: transform, opacity }
.centro h1 { margin: 0; font: 700 clamp(36px, 5.4vw, 72px)/.96 var(--f-marca); letter-spacing: -.035em }
.centro p { margin: 0; color: var(--tinta-2); font-size: 18px; max-width: 42ch }
.iniciado .centro, .fin .centro { visibility: hidden }
.bajar { position: absolute; left: 50%; bottom: 100px; translate: -50% 0; z-index: 4; margin: 0; color: var(--tinta-2); font-size: 14px; display: grid; justify-items: center; gap: 4px; transition: opacity var(--cambio); pointer-events: none }
.bajar i { width: 10px; height: 10px; border: solid var(--tinta-2); border-width: 0 2px 2px 0; rotate: 45deg; animation: bajar 1.6s var(--curva) infinite }
@keyframes bajar { 50% { translate: 0 7px } }
.bajando .bajar, .iniciado .bajar, .fin .bajar { opacity: 0 }

/* El botón del que sale todo: en la portada va en el centro; al bajar sube y queda fijo */
.nucleo { position: absolute; left: 50%; top: calc(50% + 140px); translate: -50% -50%; z-index: 7; min-height: 64px; padding: 0 34px; border-radius: 999px; white-space: nowrap;
  background: var(--silicona); color: var(--sobre-silicona); font: 600 20px var(--f-texto); transform: translate(var(--mx, 0px), var(--my, 0px));
  transition: left var(--cambio) var(--curva), top var(--cambio) var(--curva), scale var(--toque), transform 260ms var(--curva), min-height var(--cambio), padding var(--cambio), font-size var(--cambio), background var(--cambio), color var(--cambio), opacity var(--toque) }
.nucleo:active { scale: .94 }
.bajando .nucleo { left: calc(100% - 92px); top: 32px; min-height: 46px; padding: 0 20px; font-size: 16px }
.iniciado .nucleo { top: calc(50% - 12px); left: 50%; background: var(--tinta); color: var(--yeso); font-size: 17px; min-height: 52px; padding: 0 24px; cursor: default }
.nucleo.pulso { animation: pulso 480ms var(--rebote) }
@keyframes pulso { 40% { scale: 1.18 } }
.viendo .nucleo, .viendo .paginas { opacity: 0 }
/* Piezas sueltas que giran alrededor del botón: lo que después sale como ideas */
.orbita { position: absolute; left: 50%; top: calc(50% + 140px); z-index: 6; pointer-events: none }
.iniciado .orbita, .fin .orbita { display: none }
.pieza { position: absolute; left: 0; top: 0; will-change: transform, opacity }
/* Ondas que salen del botón, en reposo */
.ondas { position: absolute; left: 50%; top: calc(50% + 140px); z-index: 3; pointer-events: none; transition: opacity var(--cambio) }
.ondas i { position: absolute; left: -90px; top: -90px; width: 180px; height: 180px; border-radius: 50%; border: 1.5px solid var(--linea); opacity: 0; animation: onda 4.5s linear infinite }
.ondas i:nth-child(2) { animation-delay: -1.5s } .ondas i:nth-child(3) { animation-delay: -3s }
@keyframes onda { from { transform: scale(.5); opacity: .9 } to { transform: scale(4.2); opacity: 0 } }
.bajando .ondas, .iniciado .ondas, .fin .ondas { opacity: 0 }
/* La idea que viaja del botón al lienzo mientras se baja */
.volador { position: absolute; left: 0; top: 0; z-index: 7; opacity: 0; pointer-events: none; box-shadow: 0 0 0 1px var(--linea), 0 14px 30px -12px var(--sombra); will-change: transform, opacity; display: block }
.iniciado .volador { display: none }
/* Cierre del recorrido: el lienzo vuelve a quedar en blanco y el botón late en el centro */
.cierre { position: absolute; left: 50%; top: calc(50% - 60px); translate: -50% -50%; z-index: 4; margin: 0; width: min(92%, 620px); text-align: center; pointer-events: none;
  font: 700 clamp(32px, 4.4vw, 60px)/1 var(--f-marca); letter-spacing: -.035em; opacity: 0; transition: opacity var(--cambio) }
.fin .cierre { opacity: 1 } .iniciado .cierre { display: none }
.fin .nucleo { top: calc(50% + 30px); animation: latir 1.7s var(--curva) infinite }
@keyframes latir { from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--silicona) 55%, transparent) } to { box-shadow: 0 0 0 22px transparent } }
.palabra { display: inline-block; transition: transform 260ms var(--curva), opacity 200ms, filter 260ms }
.palabra.sale { transform: translateY(-.35em); opacity: 0; filter: blur(6px) }
.pz { display: flex; align-items: center; gap: 4px; padding: 9px 13px; border-radius: 13px; background: var(--superficie); box-shadow: 0 0 0 1px var(--linea), 0 10px 22px -12px var(--sombra); font-weight: 600; font-size: 14px; white-space: nowrap }
.pz i { width: 14px; height: 14px; border-radius: 50% } .pz u { width: 6px; border-radius: 2px 2px 0 0; align-self: flex-end; background: var(--silicona) }
.pz-boton { background: var(--tinta); color: var(--yeso); border-radius: 999px; box-shadow: none; padding: 7px 14px }
.pz-switch { width: 38px; height: 22px; padding: 0; border-radius: 99px; background: #2E7D4F; box-shadow: none; position: relative } .pz-switch::after { content: ""; position: absolute; right: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff }
.pz-letra { font: 600 20px 'Fraunces', serif; padding: 2px 10px }

/* Ideas: salen del centro y se acomodan alrededor */
.ideas { position: absolute; left: 50%; top: calc(50% - 12px); z-index: 6 }
.idea { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%) translate(var(--x, 0px), var(--y, 0px)) scale(var(--s, .2)); opacity: var(--o, 0);
  transition: transform 620ms var(--rebote), opacity 260ms; touch-action: none; user-select: none;
  min-height: 56px; padding: 10px 16px; border-radius: 18px; background: var(--superficie); box-shadow: 0 0 0 1px var(--linea), 0 14px 30px -14px var(--sombra);
  display: flex; align-items: center; gap: 11px; text-align: left; font-weight: 600; white-space: nowrap; cursor: grab }
.idea small { display: block; font-weight: 400; color: var(--tinta-2); font-size: 13px }
.idea.arrastra { transition: none; cursor: grabbing; z-index: 2 }
/* La idea que estás mirando se vuelve translúcida para no tapar la página */
.idea.viva { opacity: .5; box-shadow: 0 0 0 2px var(--silicona) }
.idea.viva.arrastra { opacity: .9 }
.viendo .idea:not(.viva) { opacity: 0 }
.tacto.viendo .idea { opacity: 0; pointer-events: none }
.muestras { display: flex } .muestras i { width: 20px; height: 20px; border-radius: 50%; margin-left: -6px; box-shadow: 0 0 0 2px var(--superficie) } .muestras i:first-child { margin-left: 0 }
.idea svg { width: 54px; height: 38px; border-radius: 6px; flex: none; box-shadow: 0 0 0 1px var(--linea) }
.mini-btn { padding: 6px 12px; font-size: 13px; font-weight: 600 }
/* Más opciones: flechas debajo del botón, de a 6 por vez */
.paginas { position: absolute; left: 50%; top: calc(50% + 44px); translate: -50% -50%; z-index: 7; display: flex; align-items: center; gap: 4px; font-size: 14px; color: var(--tinta-2); font-variant-numeric: tabular-nums; transition: opacity var(--toque) }
.flecha { width: 44px; height: 44px; border-radius: 50%; background: var(--superficie); box-shadow: inset 0 0 0 1px var(--linea); font-size: 20px; line-height: 1; transition: scale var(--toque) }
.flecha:active { scale: .9 }
.usar { position: absolute; left: 0; right: 0; bottom: 150px; z-index: 7; display: flex; justify-content: center; gap: 8px; padding: 0 16px }

/* Fichas: lo que ya elegiste, abajo; tocar una vuelve a abrir esa ronda */
.pie { position: absolute; inset: auto 0 0; z-index: 8; height: 88px; display: flex; align-items: center; gap: 12px; pointer-events: none;
  padding: 0 max(20px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(20px, env(safe-area-inset-left, 0px)) }
.pie > * { pointer-events: auto }
.fichas { flex: 1; min-width: 0; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 4px }
.fichas::-webkit-scrollbar { display: none }
.ficha { flex: none; min-height: 48px; padding: 4px 14px; border-radius: 14px; background: var(--superficie); box-shadow: inset 0 0 0 1px var(--linea); text-align: left; font-size: 13px; color: var(--tinta-2); line-height: 1.2 }
.ficha.nueva { animation: caer 420ms var(--rebote) both }
.ficha b { display: block; color: var(--tinta); font-size: 15px; font-weight: 600 }
.ficha[aria-current="true"] { box-shadow: inset 0 0 0 2.5px var(--silicona) }
div.ficha { cursor: default }
@keyframes caer { from { transform: translateY(-26px) scale(.7); opacity: 0 } }
.pista { color: var(--tinta-2); font-size: 15px; margin: 0 }
.final { display: flex; gap: 8px; flex: none }
.btn { min-height: 48px; padding: 0 20px; border-radius: 999px; font-weight: 600; white-space: nowrap; transition: scale var(--toque) }
.btn:active { scale: .96 }
.btn-1 { background: var(--silicona); color: var(--sobre-silicona) } .btn-2 { background: var(--superficie); box-shadow: inset 0 0 0 1.5px var(--tinta) }
.aviso { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 9; margin: 0; background: var(--tinta); color: var(--yeso); padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 32px) }

/* ───── La página que se arma (todo en em) ───── */
.pg { position: absolute; inset: 0; font-size: clamp(10px, 1.08vw, 17px); display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font-family: 'Instrument Sans', sans-serif; overflow: hidden;
  --r: .4em; --borde: 0 solid transparent; --sh: none; --ft: 'Instrument Sans', sans-serif; --fw: 700; --ls: -.02em; --p: 0 }
.pg[data-ui="suave"] { --r: .8em; --sh: 0 .8em 1.8em -1em rgba(0, 0, 0, .35); --ft: 'Bricolage Grotesque', sans-serif; --ls: -.035em }
.pg[data-ui="neobrutal"] { --r: .45em; --borde: .18em solid var(--fg); --sh: .32em .32em 0 var(--fg); --ft: 'Archivo', sans-serif; --fw: 900 }
.pg[data-ui="lineas"] { --r: 0em; --borde: .08em solid var(--fg); --ft: 'Fraunces', serif; --fw: 600 }
.pg[data-ui="pildora"] { --r: 1.8em; --ft: 'Unbounded', sans-serif; --ls: -.045em }
/* Fondos animados */
.pg-fondo { position: absolute; inset: 0; pointer-events: none; overflow: hidden }
.pg-fondo::before { content: ""; position: absolute; inset: 0 }
.pg[data-fondo="aurora"] .pg-fondo::before { background: radial-gradient(40em 30em at 80% 10%, color-mix(in srgb, var(--acc) 55%, transparent), transparent 70%), radial-gradient(36em 30em at 15% 90%, color-mix(in srgb, var(--acc) 35%, transparent), transparent 70%); animation: aurora 9s ease-in-out infinite alternate }
.pg[data-fondo="puntos"] .pg-fondo::before { background: radial-gradient(color-mix(in srgb, var(--fg) 28%, transparent) .11em, transparent .12em) 0 0 / 1.8em 1.8em; animation: puntos 6s linear infinite; mask-image: linear-gradient(120deg, transparent 20%, #000) }
.pg[data-fondo="ondas"] .pg-fondo::before { background: repeating-linear-gradient(115deg, transparent 0 3em, color-mix(in srgb, var(--acc) 22%, transparent) 3em 6em); background-size: 200% 100%; animation: ondas 12s linear infinite }
.pg[data-fondo="burbujas"] .pg-fondo::before { inset: 0 0 -100%; background: radial-gradient(circle, color-mix(in srgb, var(--acc) 38%, transparent) 0 3.2em, transparent 3.3em) 0 0 / 17em 15em, radial-gradient(circle, color-mix(in srgb, var(--fg) 12%, transparent) 0 1.6em, transparent 1.7em) 6em 4em / 11em 15em; animation: burbujas 16s linear infinite; filter: blur(.5em) }
.pg[data-fondo="malla"] .pg-fondo::before { inset: 35% -40% -20%; background: linear-gradient(color-mix(in srgb, var(--acc) 55%, transparent) .1em, transparent .1em) 0 0 / 3em 3em, linear-gradient(90deg, color-mix(in srgb, var(--acc) 55%, transparent) .1em, transparent .1em) 0 0 / 3em 3em; transform: perspective(30em) rotateX(62deg); animation: malla 2.4s linear infinite; mask-image: linear-gradient(transparent, #000 60%) }
.pg[data-fondo="barrido"] .pg-fondo::before { background: linear-gradient(110deg, transparent 42%, color-mix(in srgb, var(--acc) 45%, transparent) 50%, transparent 58%) 0 0 / 300% 100%; animation: barrido 4.5s var(--curva) infinite }
@keyframes aurora { to { transform: translate(-4%, 5%) scale(1.15) } } @keyframes puntos { to { background-position: 1.8em 1.8em } } @keyframes ondas { to { background-position: -13.2em 0 } }
@keyframes burbujas { to { transform: translateY(-50%) } } @keyframes malla { to { background-position: 0 3em, 0 0 } } @keyframes barrido { from { background-position: 100% 0 } to { background-position: 0 0 } }

.pg-nav { position: relative; display: flex; align-items: center; gap: 2em; padding: 1.6em 3em; flex: none }
.pg-nav b { font: var(--fw) 1.4em var(--ft); letter-spacing: var(--ls); margin-right: auto }
.pg-rollo { position: relative; flex: 1; min-height: 0; min-width: 0; overflow: hidden; display: flex; flex-direction: column }
.pg[data-scroll]:not([data-scroll=""]) .pg-rollo { overflow-y: auto; display: block; scrollbar-width: thin }
.pg-cuerpo { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: 1.05fr .95fr; gap: 3em; align-items: center; padding: 0 3em 3em }
.pg[data-scroll]:not([data-scroll=""]) .pg-cuerpo { height: 100% }
.pg h2 { margin: 0; font: var(--fw) 3.6em/1 var(--ft); letter-spacing: var(--ls); text-wrap: balance }
.pg[data-ui="pildora"] h2 { font-size: 2.9em }
.pg-bajada { margin: 1.1em 0 1.6em; color: var(--sub); font-size: 1.12em; max-width: 34em }
.pg-acc, .pg-ui { display: flex; gap: .8em; flex-wrap: wrap; align-items: center }
.pg-btn, .pg-btn2 { padding: .85em 1.5em; border-radius: var(--r); border: var(--borde); font-weight: 600 }
.pg-btn { background: var(--acc); color: var(--sobre); box-shadow: var(--sh) } .pg-btn2 { box-shadow: inset 0 0 0 .1em var(--sub) }
.pg[data-ui="lineas"] .pg-btn { background: none; color: var(--fg); border: 0; border-bottom: .2em solid var(--acc); padding-inline: .2em }
.pg-ui { margin-top: 1.8em } .pg[data-ui="base"] .pg-ui { display: none }
.pg-campo { padding: .7em 1em; min-width: 12em; border-radius: var(--r); background: var(--card); border: var(--borde); color: var(--sub); box-shadow: inset 0 0 0 .08em color-mix(in srgb, var(--fg) 22%, transparent) }
.pg-switch { width: 3em; height: 1.7em; border-radius: max(var(--r), .2em); background: var(--acc); border: var(--borde); position: relative }
.pg-switch::after { content: ""; position: absolute; right: .2em; top: 50%; translate: 0 -50%; width: 1.2em; height: 1.2em; border-radius: max(calc(var(--r) * .7), .12em); background: var(--sobre) }
.pg-chip { padding: .3em .8em; border-radius: var(--r); background: color-mix(in srgb, var(--acc) 20%, transparent); border: var(--borde); font-size: .9em; font-weight: 600 }
.pg-bloque { display: grid; gap: 1em }
.pg-caja { padding: 1.1em 1.2em; background: var(--card); border: var(--borde); border-radius: var(--r); box-shadow: var(--sh); display: flex; align-items: center; gap: 1em; min-width: 0 }
.pg-caja i { width: 3em; height: 3em; flex: none; border-radius: calc(var(--r) * .6); background: var(--acc) }
.pg-caja:nth-child(2) i { background: var(--fg) } .pg-caja:nth-child(3) i { background: var(--sub) }
.pg-caja span { margin-left: auto; color: var(--sub); white-space: nowrap; font-variant-numeric: tabular-nums } .pg-caja div { min-width: 0 } .pg-caja small { display: block; color: var(--sub) }
.pg-bloque[data-v="grilla"], .pg-bloque[data-v="semana"], .pg-bloque[data-v="numeros"] { grid-template-columns: repeat(3, 1fr) }
.pg-bloque[data-v="grilla"] .pg-caja, .pg-bloque[data-v="numeros"] .pg-caja { flex-direction: column; align-items: flex-start } .pg-bloque[data-v="grilla"] i { width: 100%; height: 6em }
.pg-bloque[data-v="grilla"] span, .pg-bloque[data-v="numeros"] span { margin-left: 0 }
.pg-bloque[data-v="destacado"] .pg-caja:first-child { flex-direction: column; align-items: flex-start } .pg-bloque[data-v="destacado"] .pg-caja:first-child i { width: 100%; height: 9em } .pg-bloque[data-v="destacado"] .pg-caja:first-child span { margin-left: 0 }
.pg-bloque[data-v="semana"] .pg-caja { flex-direction: column; align-items: flex-start; gap: .3em; padding: .8em } .pg-bloque[data-v="semana"] i { display: none } .pg-bloque[data-v="semana"] span { margin-left: 0 }
.pg-num { font: var(--fw) 2.2em/1 var(--ft); letter-spacing: var(--ls) }
.pg-graf { grid-column: 1 / -1; height: 9em; padding: 1em; background: var(--card); border: var(--borde); border-radius: var(--r); box-shadow: var(--sh); display: flex; align-items: flex-end; gap: .7em }
.pg-graf u { flex: 1; background: var(--acc); border-radius: calc(var(--r) * .4) calc(var(--r) * .4) 0 0 } .pg-graf svg { width: 100%; height: 100% }
/* Layouts */
.pg[data-l="centrado"] .pg-cuerpo { grid-template-columns: 1fr; text-align: center; justify-items: center; gap: 2em; align-content: center }
.pg[data-l="centrado"] .pg-acc, .pg[data-l="centrado"] .pg-ui { justify-content: center } .pg[data-l="centrado"] .pg-bajada { margin-inline: auto }
.pg[data-l="centrado"] .pg-bloque { grid-template-columns: repeat(3, 1fr); width: min(100%, 60em); text-align: left } .pg[data-l="centrado"] h2 { font-size: 3.1em }
.pg[data-l="afiche"] .pg-cuerpo { grid-template-columns: 1fr; align-content: end; gap: 1.5em } .pg[data-l="afiche"] h2 { font-size: 6.4em; line-height: .9 } .pg[data-l="afiche"][data-ui="pildora"] h2 { font-size: 4.6em }
.pg[data-l="afiche"] .pg-bloque { grid-template-columns: repeat(3, 1fr) } .pg[data-l="afiche"] .pg-bajada { margin-bottom: 1em }

// ───── La página, a partir de lo elegido (lo no elegido va en gris neutro) ─────
function pagina(s, entra) {
  if (!s.tipo) return '';
  const t = TIPOS[s.tipo], p = PALETAS[s.paleta] || NEUTRA;
  let bloque = t.cajas.map(([a, b]) => `<div class="pg-caja"><i></i><div><b>${a}</b></div><span>${b}</span></div>`).join('');
  if (s.tipo === 'stock') {

    bloque = nums + graf;

      <div class="pg-fila">${t.tiles.map((n, i) => `<div class="pg-tile" style="--i:${i}">${n}</div>`).join('')}</div></div>` : '';
  return `<div class="pg" data-l="${s.layout || 'partido'}" data-ui="${s.ui || 'base'}" data-fondo="${s.fondo || ''}" data-scroll="${s2 ? s.scroll : ''}" ${entra && s.entrada ? `data-entra="${s.entrada}"` : ''} style="--bg:${p.bg};--fg:${p.fg};--sub:${p.sub};--acc:${p.acc};--sobre:${p.sobre};--card:${p.card}">

/** Pone una página en una capa. Si tiene scroll interactivo, la baja sola para mostrarlo. */
function poner(capa, s, entra) {
  capa.innerHTML = pagina(s, entra);
  const pg = capa.querySelector('.pg'), rollo = capa.querySelector('.pg-rollo');
  if (!pg || !pg.dataset.scroll) return;
  const cifra = pg.querySelector('[data-cifra]');
  rollo.addEventListener('scroll', () => {
    const p = rollo.scrollTop / Math.max(1, rollo.scrollHeight - rollo.clientHeight);
    pg.style.setProperty('--p', p.toFixed(3));
    if (cifra) cifra.textContent = cifra.dataset.cifra.replace(/[\d.]+/, (n) => Math.round(+n.replace('.', '') * Math.min(1, p * 1.6)).toLocaleString('es-AR'));
  });
  if (quieto) return;
  let t0 = 0, vivo = true;
  const parar = () => (vivo = false);
  rollo.addEventListener('wheel', parar, { passive: true }); rollo.addEventListener('touchstart', parar, { passive: true });
  const paso = (t) => {
    if (!vivo || !rollo.isConnected) return;
    t0 ||= t;
    const k = (t - t0) / 5200, max = rollo.scrollHeight - rollo.clientHeight;
    if (capa === base && k > 1) return void (rollo.scrollTop = 0); // en la página elegida, una sola vuelta
    rollo.scrollTop = max * (1 - Math.cos(k * Math.PI * 2)) / 2;
    requestAnimationFrame(paso);
  };
  requestAnimationFrame(paso);
}

function esquema(id, p) {
  const r = (x, y, w, h, c) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1.5" fill="${c}"/>`;
  const d = { partido: r(5, 12, 20, 5, p.fg) + r(5, 20, 14, 3, p.sub) + r(5, 27, 10, 5, p.acc) + r(31, 9, 18, 24, p.card),
    centrado: r(14, 8, 26, 5, p.fg) + r(18, 16, 18, 3, p.sub) + r(22, 22, 10, 4, p.acc) + r(5, 29, 13, 6, p.card) + r(20.5, 29, 13, 6, p.card) + r(36, 29, 13, 6, p.card),
    afiche: r(5, 10, 44, 9, p.fg) + r(5, 21, 30, 9, p.fg) + r(5, 33, 10, 3, p.acc),
    lateral: r(0, 0, 13, 38, p.card) + r(18, 8, 20, 5, p.fg) + r(18, 17, 9, 8, p.acc) + r(29, 17, 9, 8, p.sub) + r(40, 17, 9, 8, p.sub) + r(18, 28, 31, 6, p.card) }[id];
  return `<svg viewBox="0 0 54 38" aria-hidden="true"><rect width="54" height="38" fill="${p.bg}"/>${d}</svg>`;
}
function miniBoton(id, p) {
  const e = { suave: `border-radius:9px;box-shadow:0 6px 12px -6px rgba(0,0,0,.4);background:${p.acc};color:${p.sobre}`, neobrutal: `border-radius:5px;border:2.5px solid ${p.fg};box-shadow:3px 3px 0 ${p.fg};background:${p.acc};color:${p.sobre}`,
    lineas: `border-bottom:3px solid ${p.acc};color:${p.fg};background:${p.bg}`, pildora: `border-radius:99px;background:${p.acc};color:${p.sobre}` }[id];
  return `<span class="mini-btn" style="${e}" aria-hidden="true">Botón</span>`;
}

// ───── Explosión: las ideas salen del centro y se acomodan alrededor ─────
function posiciones(n) {
  const w = app.clientWidth, h = app.clientHeight - 150;
  if (w < 760) return Array.from({ length: n }, (_, i) => { const fila = Math.floor(i / 2), arriba = fila % 2 === 0, k = Math.floor(fila / 2), solo = n % 2 === 1 && i === n - 1;
    return [solo ? 0 : (i % 2 ? 1 : -1) * w * .24, (arriba ? -1 : 1) * (108 + k * 62)]; });
  const rx = Math.min(w * .33, 470), ry = Math.min(h * .36, 270);
  return Array.from({ length: n }, (_, i) => { const a = -Math.PI / 2 + (i / n) * Math.PI * 2 + (n % 2 ? 0 : Math.PI / n); return [Math.cos(a) * rx, Math.sin(a) * ry]; });
}
function abrir(i, pag = 0) {
  ronda = i; hoja = pag; viva = null; turno++;
  const def = rondasDe(estado)[i];
  app.classList.add('iniciado', 'eligiendo'); app.classList.remove('viendo', 'bajando');
  portada.hidden = true; $('#final').hidden = true; $('#usar').hidden = true; nucleo.hidden = false;
  nucleo.textContent = def.pregunta; nucleo.classList.add('pulso'); nucleo.onanimationend = () => nucleo.classList.remove('pulso');
  const todas = def.ops(estado), hojas = Math.ceil(todas.length / POR_VEZ);
  const ops = todas.slice(pag * POR_VEZ, pag * POR_VEZ + POR_VEZ), pos = posiciones(ops.length);
  $('#paginas').hidden = hojas < 2; $('#cuenta').textContent = `${pag + 1} de ${hojas}`;
  $('#antes').onclick = () => cambiarHoja((pag - 1 + hojas) % hojas); $('#despues').onclick = () => cambiarHoja((pag + 1) % hojas);
  ideas.innerHTML = '';
  ops.forEach((op, k) => {
    const b = document.createElement('button');
    b.className = 'idea'; b.innerHTML = op.html; b.setAttribute('aria-label', op.nombre);
    b.style.transitionDelay = `${k * 40}ms`;
    ideas.append(b);
    requestAnimationFrame(() => requestAnimationFrame(() => { const tope = Math.max(0, app.clientWidth / 2 - b.offsetWidth / 2 - 10); pos[k][0] = Math.max(-tope, Math.min(tope, pos[k][0]));
      b.style.setProperty('--x', pos[k][0] + 'px'); b.style.setProperty('--y', pos[k][1] + 'px'); b.style.setProperty('--s', 1); b.style.setProperty('--o', 1); }));
    setTimeout(() => (b.style.transitionDelay = '0ms'), 700);
    const ver = () => mostrar(op, b), dejar = () => ocultar(b);
    b.addEventListener('pointerenter', (e) => !tacto && e.pointerType === 'mouse' && !arrastre && ver());
    b.addEventListener('pointerleave', (e) => e.pointerType === 'mouse' && !arrastre && dejar());
    b.addEventListener('focus', () => !tacto && b.matches(':focus-visible') && ver()); b.addEventListener('blur', dejar);
    b.addEventListener('click', () => { if (recienArrastrado) return; if (tacto && viva !== b) return ver(); elegir(op); });
    // Arrastrar al centro también elige.
    b.addEventListener('pointerdown', (e) => { if (e.pointerType !== 'mouse') return; arrastre = { b, op, x0: e.clientX, y0: e.clientY, ox: pos[k][0], oy: pos[k][1], movio: false }; b.setPointerCapture(e.pointerId); });
    b.addEventListener('pointermove', (e) => { if (!arrastre || arrastre.b !== b) return; const dx = e.clientX - arrastre.x0, dy = e.clientY - arrastre.y0;
      if (!arrastre.movio && Math.hypot(dx, dy) < 8) return; arrastre.movio = true; b.classList.add('arrastra');
      b.style.setProperty('--x', arrastre.ox + dx + 'px'); b.style.setProperty('--y', arrastre.oy + dy + 'px'); });
    b.addEventListener('pointerup', (e) => { if (!arrastre || arrastre.b !== b) return; const a = arrastre; arrastre = null; b.classList.remove('arrastra'); if (!a.movio) return;
      recienArrastrado = true; setTimeout(() => (recienArrastrado = false), 50);
      const x = a.ox + e.clientX - a.x0, y = a.oy + e.clientY - a.y0;
      if (Math.hypot(x, y) < 130) elegir(a.op); else { b.style.setProperty('--x', a.ox + 'px'); b.style.setProperty('--y', a.oy + 'px'); } });
  });
  fichas(estado, true);
}
function recoger() { ideas.querySelectorAll('.idea').forEach((b) => { b.style.setProperty('--x', '0px'); b.style.setProperty('--y', '0px'); b.style.setProperty('--s', .2); b.style.setProperty('--o', 0); b.disabled = true; }); }
function cambiarHoja(pag) { const r = ronda, t = ++turno; recoger(); setTimeout(() => t === turno && abrir(r, pag), 300); }
function mostrar(op, b) {
  viva?.classList.remove('viva'); viva = b; b.classList.add('viva');
  const clave = rondasDe(estado)[ronda].clave;
  poner(prev, { ...estado, [clave]: op.id }, clave === 'entrada');
  prev.classList.remove('sin'); prev.classList.add('on'); app.classList.add('viendo');
  if (tacto) { $('#usar').hidden = false; $('#usar-esta').textContent = `Usar «${op.nombre}»`; $('#usar-esta').onclick = () => elegir(op); }
}
function ocultar(b) {
  if (viva !== b || tacto) return;
  b.classList.remove('viva'); viva = null; prev.classList.remove('on'); app.classList.remove('viendo');
}
function elegir(op) {
  const clave = rondasDe(estado)[ronda].clave;
  if (clave === 'tipo' && estado.tipo !== op.id) { const { paleta, ui, entrada } = estado; estado = {}; if (paleta) estado.paleta = paleta; if (ui) estado.ui = ui; if (entrada !== undefined) estado.entrada = entrada; } // otra rama: lo propio se vuelve a elegir
  estado[clave] = op.id;
  poner(base, estado, clave === 'entrada'); $('#lienzo').classList.add('hay');
  prev.classList.add('sin'); prev.classList.remove('on'); prev.innerHTML = ''; app.classList.remove('viendo'); viva = null; $('#usar').hidden = true;
  recoger();
  const falta = rondasDe(estado).findIndex((r) => !(r.clave in estado)), t = ++turno;
  setTimeout(() => t === turno && (falta < 0 ? terminar() : abrir(falta)), 420);
  fichas(estado, true, clave);
}
function terminar() {
  ronda = -1; ideas.innerHTML = ''; app.classList.remove('eligiendo');
  nucleo.hidden = true; $('#paginas').hidden = true; $('#final').hidden = false;
  poner(base, estado, true); fichas(estado, true);
}
/** Fichas de lo elegido. En la portada son solo de muestra (no se tocan). */
function fichas(s, tocables, nueva) {
  const f = $('#fichas'); f.innerHTML = ''; $('#cero').hidden = !tocables || !s.tipo;
  rondasDe(s).forEach((r, i) => {
    if (!(r.clave in s)) return;
    const b = document.createElement(tocables ? 'button' : 'div');
    b.className = 'ficha' + (r.clave === nueva ? ' nueva' : ''); if (tocables) { b.setAttribute('aria-current', String(i === ronda)); b.onclick = () => abrir(i); }
    b.innerHTML = `${r.ficha}<b>${r.valor(s[r.clave])}</b>`;
    f.append(b);
  });
  if (f.children.length) return void (f.scrollLeft = f.scrollWidth);
  f.innerHTML = `<p class="pista">${!tocables ? 'Gratis y sin cuenta. Lo que elegís queda en tu navegador.' : tacto ? 'Tocá una idea para verla en la página y después el botón de usarla.' : 'Pasá el mouse por una idea para verla en la página. Tocala o arrastrala al centro para quedártela.'}</p>`;
}
function avisar(t) { const a = $('#aviso'); a.textContent = t; a.hidden = false; clearTimeout(avisar.t); avisar.t = setTimeout(() => (a.hidden = true), 3200); }

// ───── Portada: el scroll arma páginas cuadro a cuadro ─────
// Nada se vuelve a dibujar mientras se baja: las 15 capas se arman una vez y después solo
// cambian transform, opacity y clip-path, siguiendo al scroll con un pequeño retraso.
const PIEZAS = ['<span class="pz pz-boton">Empezar</span>', '<span class="pz"><i style="background:#2F4BFF"></i><i style="background:#F0552B"></i><i style="background:#C6F23C"></i></span>', '<span class="pz pz-switch"></span>',
  '<span class="pz pz-letra">Aa</span>', '<span class="pz" style="height:34px"><u style="height:8px"></u><u style="height:16px"></u><u style="height:11px"></u><u style="height:20px"></u></span>', '<span class="pz">Turnos</span>',
  '<span class="pz" style="border-radius:4px;box-shadow:3px 3px 0 var(--tinta), 0 0 0 2px var(--tinta)">Comprar</span>', '<span class="pz"><i style="background:#2E7D4F"></i>Bosque</span>',
  '<span class="pz" style="border-radius:99px"><i style="background:#C084FF"></i><i style="background:#1C1230"></i></span>', '<span class="pz" style="font-family:Unbounded,sans-serif;font-size:12px">Hola</span>'];
const DESTINOS = [[.15, .3], [.5, .25], [.8, .3], [.2, .6], [.5, .55], [.8, .6], [.3, .8], [.65, .8], [.4, .4], [.6, .45]];
const ANCLAS = [[.5, .5], [.3, .62], [.62, .4], [.26, .72], [.74, .3]]; // dónde cae cada idea en el lienzo
const PALABRAS = ['página', 'tienda', 'landing', 'app', 'portfolio', 'sistema'];
const INI = .06, FIN = .94, ETAPAS = 5;
const alAzar = (a) => a[Math.floor(Math.random() * a.length)];
const tope = (x) => Math.max(0, Math.min(1, x)), suave = (x) => x * x * (3 - 2 * x);
const centro = $('.centro'), volador = $('#volador'), demoCaja = $('#demo');
let demo = [], piezas = [], geo = null, P = 0, capaAct = -2, fichasAct = '', raf = 0, raton = null;

function armarDemo() {
  demoCaja.innerHTML = ''; demo = [];
  for (const tipo of Object.keys(TIPOS).sort(() => Math.random() - .5).slice(0, 3)) {
    const x = RAMAS[tipo].extras[0]; let s = {};
    for (const clave of ['tipo', 'paleta', 'layout', 'ui', x.clave]) {
      const valor = { tipo, paleta: alAzar(Object.keys(PALETAS)), layout: alAzar(RAMAS[tipo].layouts), ui: alAzar(Object.keys(UIS)) }[clave] ?? alAzar(x.ops(s).map((o) => o.id).filter(Boolean));
      s = { ...s, [clave]: valor };
      const el = document.createElement('div'); el.className = 'capa'; el.style.visibility = 'hidden'; el.innerHTML = pagina(s); demoCaja.append(el);
      const r = rondasDe(s).find((r) => r.clave === clave);
      demo.push({ el, ficha: r.ficha, valor: r.valor(valor) });
    }
  }
}
function medir() {
  const a = app.getBoundingClientRect(), l = $('#lienzo').getBoundingClientRect(), chico = a.width < 760;
  geo = { w: a.width, h: a.height, lx: l.left - a.left, ly: l.top - a.top, lw: l.width, lh: l.height, bx: a.width - (chico ? 76 : 92), by: 32, cx: a.width / 2, cy: a.height / 2 + (chico ? 120 : 140) };
  $('#largo').style.height = quieto ? '0' : a.height * 6 + 'px'; // 5 pantallas de recorrido
  const n = PIEZAS.length;
  $('#orbita').innerHTML = PIEZAS.map((h) => `<div class="pieza">${h}</div>`).join('');
  piezas = [...$('#orbita').children].map((el, i) => ({ el, f: (i / n) * Math.PI * 2, v: i % 2 ? -.34 : .46,
    rx: Math.min(a.width * .44, i % 2 ? 350 : 255), ry: (i % 2 ? 92 : 66) * (chico ? .85 : 1), ax: DESTINOS[i][0], ay: DESTINOS[i][1] }));
}
function cuadro(t) {
  if (!quieto) raf = requestAnimationFrame(cuadro);
  const meta = portada.scrollTop / Math.max(1, portada.scrollHeight - portada.clientHeight);
  P += (meta - P) * .13; if (Math.abs(meta - P) < .0003) P = meta;
  const sal = tope(P / INI), e = suave(sal), fin = tope((P - FIN) / (1 - FIN));
  app.classList.toggle('fin', fin > .5); app.classList.toggle('bajando', P > .006 && fin <= .5);
  // El título se va hacia arriba a medida que se baja.
  centro.style.opacity = 1 - sal * 1.6; centro.style.transform = `translate(-50%, calc(-50% - ${sal * 70}px))`;
  // El botón se acerca al mouse cuando está cerca (solo en reposo).
  let mx = 0, my = 0;
  if (raton && P < .006) { const dx = raton.x - geo.cx, dy = raton.y - geo.cy, d = Math.hypot(dx, dy); if (d < 190) { mx = dx * .16; my = dy * .16; } }
  nucleo.style.setProperty('--mx', mx.toFixed(1) + 'px'); nucleo.style.setProperty('--my', my.toFixed(1) + 'px');
  // Piezas: giran en dos anillos, se apartan del mouse y, al bajar, vuelan a su lugar en la página.
  if (sal < 1) for (const z of piezas) {
    const a = (t / 1000) * z.v + z.f, prof = (Math.sin(a) + 1) / 2;
    let x = Math.cos(a) * z.rx, y = Math.sin(a) * z.ry;
    if (raton) { const dx = geo.cx + x - raton.x, dy = geo.cy + y - raton.y, d = Math.hypot(dx, dy) || 1; if (d < 150) { const f = ((150 - d) / 150) * 52; x += (dx / d) * f; y += (dy / d) * f; } }
    const tx = geo.lx + geo.lw * z.ax - geo.cx, ty = geo.ly + geo.lh * z.ay - geo.cy;
    z.el.style.transform = `translate(${(x + (tx - x) * e).toFixed(1)}px, ${(y + (ty - y) * e).toFixed(1)}px) translate(-50%, -50%) scale(${((.82 + prof * .3) * (1 - e * .4)).toFixed(3)})`;
    z.el.style.opacity = (1 - e * e).toFixed(3);
  } else if (piezas[0]?.el.style.opacity !== '0') for (const z of piezas) z.el.style.opacity = '0';
  // Etapas: cada idea vuela desde el botón, cae en el lienzo y se abre desde ahí.
  const q = ((P - INI) / (FIN - INI)) * demo.length, cur = P < INI ? -1 : Math.min(demo.length - 1, Math.floor(q)), u = cur < 0 ? 0 : tope(q - cur);
  if (cur !== capaAct) {
    demo.forEach((d, i) => { d.el.style.visibility = i === cur || i === cur - 1 ? 'visible' : 'hidden'; if (i === cur - 1) d.el.style.clipPath = 'none'; });
    capaAct = cur;
    if (cur >= 0) volador.innerHTML = `${demo[cur].ficha}<b>${demo[cur].valor}</b>`;
  }
  $('#lienzo').classList.toggle('hay', cur >= 0 && fin < .5);
  demoCaja.style.opacity = 1 - fin;
  if (cur >= 0) {
    const [ax, ay] = ANCLAS[cur % ETAPAS], x1 = geo.lx + geo.lw * ax, y1 = geo.ly + geo.lh * ay, v = suave(tope(u / .42));
    const radio = Math.hypot(Math.max(ax, 1 - ax) * geo.lw, Math.max(ay, 1 - ay) * geo.lh) * suave(tope((u - .3) / .7));
    demo[cur].el.style.clipPath = `circle(${radio.toFixed(1)}px at ${ax * 100}% ${ay * 100}%)`;
    volador.style.transform = `translate(${(geo.bx + (x1 - geo.bx) * v).toFixed(1)}px, ${(geo.by + (y1 - geo.by) * v - Math.sin(v * Math.PI) * 70).toFixed(1)}px) translate(-50%, -50%) scale(${(.55 + .45 * v).toFixed(3)})`;
    volador.style.opacity = Math.min(tope(u / .08), 1 - tope((u - .5) / .22)).toFixed(3);
  } else volador.style.opacity = '0';
  // Fichas de muestra: aparecen cuando su idea ya cayó.
  const pag = cur < 0 ? 0 : Math.floor(cur / ETAPAS), cuantas = cur < 0 || fin > .5 ? 0 : (cur % ETAPAS) + (u > .42 ? 1 : 0), clave = pag + '-' + cuantas;
  if (clave !== fichasAct) {
    const crece = fichasAct && +fichasAct.split('-')[1] < cuantas && +fichasAct.split('-')[0] === pag; fichasAct = clave;
    const f = $('#fichas');
    f.innerHTML = cuantas ? demo.slice(pag * ETAPAS, pag * ETAPAS + cuantas).map((d, i) => `<div class="ficha${crece && i === cuantas - 1 ? ' nueva' : ''}">${d.ficha}<b>${d.valor}</b></div>`).join('')
      : '<p class="pista">Gratis y sin cuenta. Lo que elegís queda en tu navegador.</p>';
    f.scrollLeft = f.scrollWidth;
  }
}
app.addEventListener('pointermove', (ev) => { if (ev.pointerType !== 'mouse') return; const a = app.getBoundingClientRect(); raton = { x: ev.clientX - a.left, y: ev.clientY - a.top }; });
app.addEventListener('pointerleave', () => (raton = null));
// La última palabra del título va cambiando.
let nPalabra = 0;
if (!quieto) setInterval(() => { if (app.classList.contains('iniciado') || document.hidden) return; const p = $('#palabra'); p.classList.add('sale');
  setTimeout(() => { p.textContent = PALABRAS[++nPalabra % PALABRAS.length]; p.classList.remove('sale'); }, 260); }, 2400);

function empezar() {
  turno++; cancelAnimationFrame(raf); demoCaja.innerHTML = ''; demo = []; capaAct = -2; fichasAct = ''; volador.style.opacity = '0'; centro.removeAttribute('style');
  nucleo.style.removeProperty('--mx'); nucleo.style.removeProperty('--my'); app.classList.remove('fin', 'bajando');
  base.innerHTML = ''; prev.innerHTML = ''; prev.classList.add('sin'); prev.classList.remove('on'); $('#lienzo').classList.remove('hay');
  nucleo.onclick = null; abrir(0);
}
function aPortada() {
  turno++; cancelAnimationFrame(raf); estado = {}; ronda = -1; base.innerHTML = ''; ideas.innerHTML = ''; $('#lienzo').classList.remove('hay');
  $('#final').hidden = true; $('#paginas').hidden = true; $('#usar').hidden = true; nucleo.hidden = false; nucleo.textContent = 'Empezar'; nucleo.onclick = empezar;
  app.classList.remove('iniciado', 'eligiendo', 'viendo', 'bajando', 'fin'); portada.hidden = false; portada.scrollTop = 0; $('#cero').hidden = true;
  P = 0; capaAct = -2; fichasAct = ''; armarDemo(); medir(); demoCaja.style.opacity = '1';
  raf = requestAnimationFrame(cuadro);
}

$('#cero').onclick = aPortada;
$('#otras').onclick = () => { prev.classList.remove('on'); abrir(ronda, hoja); };
$('#bajar-md').onclick = () => avisar('Esto es una maqueta: en la versión real acá baja tu DESIGN.md.');
$('#bajar-html').onclick = () => avisar('Esto es una maqueta: en la versión real acá baja la página en HTML.');
addEventListener('resize', () => { if (ronda >= 0) abrir(ronda, hoja); else if (!estado.tipo) aPortada(); });
aPortada();
</script>
